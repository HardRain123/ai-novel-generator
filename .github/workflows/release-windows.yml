name: Release Windows Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Verify tag matches app version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Git tag must be v$version, got ${{ github.ref_name }}" }
      - name: Install Python dependencies
        run: uv sync --dev
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Build Windows installer and update metadata
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Verify release artifacts
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item "desktop/dist/WeDream-Setup-$version-x64.exe"
          $blockmap = Get-Item "desktop/dist/WeDream-Setup-$version-x64.exe.blockmap"
          $metadata = Get-Item desktop/dist/latest.yml
          if ($installer.Length -lt 1MB) { throw "Windows installer is unexpectedly small" }
          Write-Output "Installer: $($installer.FullName) ($([math]::Round($installer.Length / 1MB, 2)) MB)"
          Write-Output "Blockmap: $($blockmap.FullName)"
          Write-Output "Metadata: $($metadata.FullName)"
      - name: Upload Windows installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/WeDream-Setup-*.exe
            desktop/dist/WeDream-Setup-*.exe.blockmap
            desktop/dist/latest.yml
          fail_on_unmatched_files: true
