services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: sqlite:////data/data.db
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      ALLOW_INSECURE_MODEL_URLS: ${ALLOW_INSECURE_MODEL_URLS:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    volumes:
      - novel_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uv", "run", "--no-sync", "python", "-m", "app.worker"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: sqlite:////data/data.db
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      ALLOW_INSECURE_MODEL_URLS: ${ALLOW_INSECURE_MODEL_URLS:-false}
    volumes:
      - novel_data:/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  novel_data:
